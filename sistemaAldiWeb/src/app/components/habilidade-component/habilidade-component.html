<!-- Um container que dá um fundo suave para a página inteira -->
<div class="form-background">

  <!-- O cartão principal que contém o formulário -->
  <div class="form-card shadow-lg">

    <!-- Cabeçalho do Cartão -->
    <div class="card-header">
      <h2 class="mb-0">
        <i class="bi bi-box-seam me-2"></i> <!-- Ícone do Bootstrap -->
        Cadastro de Habilidades
      </h2>
      <p class="text-muted mb-0">Preencha os dados para criar uma nova Habilidade no sistema.</p>
    </div>

    <!-- Corpo do Cartão com o Formulário -->
    <div class="card-body">
      <!-- A tag <form> com o binding [formGroup] e o evento (ngSubmit) -->
      <form [formGroup]="habilidadeForm" (ngSubmit)="onSubmit()">

        <div class="row mb-3">
          <div class="col-md-6">
            <label for="codigo" class="form-label">Código da Habilidade</label>
            <input type="text" id="codigo" class="form-control" formControlName="codigo" placeholder="Ex: 1">
            <div *ngIf="isInvalid('codigo')" class="invalid-feedback d-block">
              O código é obrigatório.
            </div>
          </div>
          <div class="col-md-6">
            <label for="nome" class="form-label">Nome da Habilidade</label>
            <input type="text" id="nome" class="form-control" formControlName="nome" placeholder="Ex: Desenvolvedor">
            <div *ngIf="isInvalid('nome')" class="invalid-feedback d-block">
              O nome é obrigatório.
            </div>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-md-6">
            <label for="descricao" class="form-label">Descrição</label>
            <input type="text" id="descricao" class="form-control" formControlName="descricao"
              placeholder="Ex: Desenvolvedor de software">
            <div *ngIf="isInvalid('descricao')" class="invalid-feedback d-block">
              A Descrição é obrigatória.
            </div>
          </div>
          <div class="col-md-6">
            <label for="categoria" class="form-label">Categoria</label>
            <select id="categoria" class="form-control" formControlName="categoria" required>
              <option value="" disabled selected>Selecione a Categoria</option>
              <option value="TECNICA">TECNICA</option>
              <option value="COMPORTAMENTAL">COMPORTAMENTAL</option>
              <option value="IDIOMA">IDIOMA</option>
              <option value="CERTIFICACAO">CERTIFICACAO</option>
            </select>
            <div *ngIf="isInvalid('categoria')" class="invalid-feedback d-block">
              A Categoria é obrigatória.
            </div>
          </div>
        </div>

        <!-- Checkbox 'Ativo' -->
        <div class="form-check form-switch mb-4">
          <input class="form-check-input" type="checkbox" role="switch" id="ativo" formControlName="ativo">
          <label class="form-check-label" for="ativo">Habilidade Ativa</label>
        </div>

        <!-- Divisor -->
        <hr class="my-4">

        <!-- Botões de Ação -->
        <div class="d-flex justify-content-end gap-2">
          <button type="button" class="btn btn-secondary">Cancelar</button>
          <button type="submit" class="btn btn-submit" [disabled]="habilidadeForm.invalid">
            <i class="bi bi-check-lg me-1"></i>
            Salvar Habilidade
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
