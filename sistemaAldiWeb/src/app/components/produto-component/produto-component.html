<!-- Um container que dá um fundo suave para a página inteira -->
<div class="form-background">

  <!-- O cartão principal que contém o formulário -->
  <div class="form-card shadow-lg">

    <!-- Cabeçalho do Cartão -->
    <div class="card-header">
      <h2 class="mb-0">
        <i class="bi bi-box-seam me-2"></i> <!-- Ícone do Bootstrap -->
        Cadastro de Produtos
      </h2>
      <p class="text-muted mb-0">Preencha os dados para criar um novo Produto no sistema.</p>
    </div>

    <!-- Corpo do Cartão com o Formulário -->
    <div class="card-body">
      <!-- A tag <form> com o binding [formGroup] e o evento (ngSubmit) -->
      <form [formGroup]="produtoForm" (ngSubmit)="onSubmit()">

        <div class="row mb-3">
          <div class="col-md-6">
            <label for="codigo" class="form-label">Código do Produto</label>
            <input type="text" id="codigo" class="form-control" formControlName="codigo" placeholder="Ex: 1">
            <div *ngIf="isInvalid('codigo')" class="invalid-feedback d-block">
              O código é obrigatório.
            </div>
          </div>
          <div class="col-md-6">
            <label for="nome" class="form-label">Nome do Produto</label>
            <input type="text" id="nome" class="form-control" formControlName="nome"
              placeholder="Ex: Licença Microsoft Office">
            <div *ngIf="isInvalid('nome')" class="invalid-feedback d-block">
              O nome é obrigatório.
            </div>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-md-6">
            <label for="descricao" class="form-label">Descrição</label>
            <input type="text" id="descricao" class="form-control" formControlName="descricao"
              placeholder="Ex: Licença Microsoft">
            <div *ngIf="isInvalid('descricao')" class="invalid-feedback d-block">
              A Descrição é obrigatória.
            </div>
          </div>
          <div class="col-md-6">
            <label for="categoria" class="form-label">Categoria</label>
            <input type="text" id="categoria" class="form-control" formControlName="categoria"
              placeholder="Ex: Software">
            <div *ngIf="isInvalid('categoria')" class="invalid-feedback d-block">
              A Categoria é obrigatória.
            </div>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-md-6">
            <label for="unidade" class="form-label">Unidade</label>
            <input type="text" id="unidade" class="form-control" formControlName="unidade" placeholder="Ex: Unidade">
            <div *ngIf="isInvalid('unidade')" class="invalid-feedback d-block">
              A unidade é obrigatória.
            </div>
          </div>
          <div class="col-md-6">
            <label for="valor_unitario" class="form-label">Valor Unitário</label>
            <input type="text" id="valor_unitario" class="form-control" formControlName="valor_unitario"
              placeholder="Ex: 560,00">
            <div *ngIf="isInvalid('valor_unitario')" class="invalid-feedback d-block">
              O Valor Unitário é obrigatório.
            </div>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-md-6">
            <label for="estoque_minimo" class="form-label">Estoque Mínimo</label>
            <input type="text" id="estoque_minimo" class="form-control" formControlName="estoque_minimo"
              placeholder="Ex: 1">
            <div *ngIf="isInvalid('estoque_minimo')" class="invalid-feedback d-block">
              O Estoque Mínimo é obrigatório.
            </div>
          </div>
          <div class="col-md-6">
            <label for="estoque_atual" class="form-label">Estoque Atual</label>
            <input type="text" id="estoque_atual" class="form-control" formControlName="estoque_atual"
              placeholder="Ex: 50">
            <div *ngIf="isInvalid('estoque_atual')" class="invalid-feedback d-block">
              O Estoque Atual é obrigatório.
            </div>
          </div>
        </div>

        <!-- Checkbox 'Ativo' -->
        <div class="form-check form-switch mb-4">
          <input class="form-check-input" type="checkbox" role="switch" id="ativo" formControlName="ativo">
          <label class="form-check-label" for="ativo">Produto Ativo</label>
        </div>

        <!-- Divisor -->
        <hr class="my-4">

        <!-- Botões de Ação -->
        <div class="d-flex justify-content-end gap-2">
          <button type="button" class="btn btn-secondary">Cancelar</button>
          <button type="submit" class="btn btn-submit" [disabled]="produtoForm.invalid">
            <i class="bi bi-check-lg me-1"></i>
            Salvar Produto
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
