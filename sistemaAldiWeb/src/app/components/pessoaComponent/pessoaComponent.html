<div class="form-container d-flex align-items-center justify-content-center">
  <div class="form-card p-4 p-md-5">
    
    <h2 class="form-title text-center mb-4">Criar Conta</h2>
    <p class="form-subtitle text-center text-muted mb-4">Preencha os campos abaixo para se cadastrar.</p>

    <form>
      <div class="form-floating mb-3">
        <input type="text" class="form-control" id="nomeCompleto" placeholder="Nome Completo">
        <label for="nomeCompleto">Nome Completo</label>
      </div>

      <div class="form-floating mb-3">
        <input type="email" class="form-control" id="email" placeholder="nome@exemplo.com">
        <label for="email">Endereço de Email</label>
      </div>

      <div class="form-floating mb-4">
        <input type="password" class="form-control" id="senha" placeholder="Senha">
        <label for="senha">Senha</label>
      </div>
      
      <div class="d-grid">
        <button type="submit" class="btn btn-primary btn-lg">Cadastrar</button>
      </div>
    </form>
    
    <div class="text-center mt-4">
      <small class="text-muted">Já tem uma conta? <a href="#">Faça login</a></small>
    </div>

  </div>
</div>
