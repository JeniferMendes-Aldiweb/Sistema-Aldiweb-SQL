<div class='toggleSidebar'>
    <div class="dashboard-nav">
        <div>
            <header>
                <a [routerLink]="['/user']" class="menu-toggle" (click)="toggleSidebar()">
                </a>
                <img src="../../../../assets/images/logoescrita.png" alt="Logo GN" class="img_logo_header"
                    style="width: 80%; max-width: 110px; height: auto;">
                <link rel="stylesheet"
                    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
            </header>

            <nav class="dashboard-nav-list">
                <div class="btn-expandir">
                    <i class="bi bi-list"></i>
                </div>
                <a [routerLink]="['/user']" [routerLinkActive]="['activated']" [routerLinkActiveOptions]="{exact: true}"
                    class="dashboard-nav-item">
                    <i class="bi bi-house-door"></i>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                    <span class="txt-link">Home</span>
                </a>

                <div data-ls-module="collapse" data-target="#accordeon0" class="ls-collapse ">
                    <a class="d-flex justify-content-between dashboard-nav-item" data-bs-toggle="collapse"
                        data-bs-targeT="#cadastros">
                        <i class="bi bi-pencil-square"></i>
                        <span class="txt-link">Cadastros</span>
                        <i class="bi bi-arrow-down-short"></i>
                    </a>

                    <div class="collapse" id="cadastros">

                        <div *ngSwitchCase="'admin'">
                            <div data-ls-module="collapse" data-target="#accordeon0" class="ls-collapse ">
                                <a class="d-flex justify-content-between dashboard-nav-item" data-bs-toggle="collapse"
                                    data-bs-targeT="#leadsCollapse">
                                    <i class="bi bi-newspaper"></i>
                                    <span class="txt-link">Leads</span>
                                    <i class="bi bi-arrow-down-short"></i>
                                </a>
                                <div class="collapse" id="leadsCollapse">
                                    <a [routerLink]="['/user/lead']" [routerLinkActive]="['activated']"
                                        class="dashboard-nav-item">Novo Leads</a>
                                    <a [routerLink]="['/user/leads']" [routerLinkActive]="['activated']"
                                        class="dashboard-nav-item">Todos Leads</a>
                                    <a [routerLink]="['/user/kanbanLeads']" [routerLinkActive]="['activated']"
                                        class="dashboard-nav-item">Kanban Leads</a>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
            </nav>
        </div>
    </div>
</div>
