<!-- Um container que dá um fundo suave para a página inteira -->
<div class="form-background">

  <!-- O cartão principal que contém o formulário -->
  <div class="form-card shadow-lg">

    <!-- Cabeçalho do Cartão -->
    <div class="card-header">
      <h2 class="mb-0">
        <i class="bi bi-box-seam me-2"></i> <!-- Ícone do Bootstrap -->
        Cadastro de Filial
      </h2>
      <p class="text-muted mb-0">Preencha os dados para criar uma nova Filial no sistema.</p>
    </div>

    <!-- Corpo do Cartão com o Formulário -->
    <div class="card-body">
      <!-- A tag <form> com o binding [formGroup] e o evento (ngSubmit) -->
      <form [formGroup]="filialForm" (ngSubmit)="onSubmit()">

        <div class="row mb-3">
          <div class="col-md-6">
            <label for="coligada_id" class="form-label">Coligada da Filial</label>
            <input type="text" id="coligada_id" class="form-control" formControlName="coligada_id" placeholder="Ex: 1">
            <div *ngIf="isInvalid('coligada_id')" class="invalid-feedback d-block">
              A Coligada é obrigatória.
            </div>
          </div>
          <div class="col-md-6">
            <label for="matriz" class="form-label">matriz da Filial</label>
            <input type="text" id="matriz" class="form-control" formControlName="matriz" placeholder="Ex: 1">
            <div *ngIf="isInvalid('matriz')" class="invalid-feedback d-block">
              A Matriz é obrigatória.
            </div>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-md-6">
            <label for="codigo" class="form-label">Código da Filial</label>
            <input type="text" id="codigo" class="form-control" formControlName="codigo" placeholder="Ex: 1">
            <div *ngIf="isInvalid('codigo')" class="invalid-feedback d-block">
              O código é obrigatório.
            </div>
          </div>
          <div class="col-md-6">
            <label for="nome" class="form-label">Nome da Filial</label>
            <input type="text" id="nome" class="form-control" formControlName="nome" placeholder="Ex: AldiWeb">
            <div *ngIf="isInvalid('nome')" class="invalid-feedback d-block">
              O nome é obrigatório.
            </div>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-md-6">
            <label for="razao_social" class="form-label">Razão Social</label>
            <input type="text" id="razao_social" class="form-control" formControlName="razao_social"
              placeholder="Ex: AldiWeb">
            <div *ngIf="isInvalid('razao_social')" class="invalid-feedback d-block">
              Razão social é obrigatório.
            </div>
          </div>
          <div class="col-md-6">
            <label for="cnpj" class="form-label">Cnpj</label>
            <input type="text" id="cnpj" class="form-control" formControlName="cnpj" placeholder="Ex: 00000000000000">
            <div *ngIf="isInvalid('cnpj')" class="invalid-feedback d-block">
              O cnpj é obrigatório.
            </div>
          </div>
        </div>


        <div class="row mb-3">
          <div class="col-md-6">
            <label for="inscricao_estadual" class="form-label">Inscrição estadual</label>
            <input type="text" id="inscricao_estadual" class="form-control" formControlName="inscricao_estadual"
              placeholder="Ex: 0000000000000">
            <div *ngIf="isInvalid('inscricao_estadual')" class="invalid-feedback d-block">
              A Inscrição estadual é obrigatória.
            </div>
          </div>
          <div class="col-md-6">
            <label for="inscricao_municipal" class="form-label">Inscrição Municipal</label>
            <input type="text" id="inscricao_municipal" class="form-control" formControlName="inscricao_municipal"
              placeholder="Ex: 00000000000000">
            <div *ngIf="isInvalid('inscricao_municipal')" class="invalid-feedback d-block">
              A Inscrição municipal é obrigatória.
            </div>
          </div>
        </div>
        <!-- Checkbox 'Ativo' -->
        <div class="form-check form-switch mb-4">
          <input class="form-check-input" type="checkbox" role="switch" id="ativo" formControlName="ativo">
          <label class="form-check-label" for="ativo">Coligada Ativa</label>
        </div>

        <!-- Divisor -->
        <hr class="my-4">

        <!-- Botões de Ação -->
        <div class="d-flex justify-content-end gap-2">
          <button type="button" class="btn btn-secondary">Cancelar</button>
          <button type="submit" class="btn btn-submit" [disabled]="filialForm.invalid">
            <i class="bi bi-check-lg me-1"></i>
            Salvar Filial
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
