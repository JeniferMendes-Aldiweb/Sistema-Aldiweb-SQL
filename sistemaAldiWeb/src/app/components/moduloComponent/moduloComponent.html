<!-- Um container que dá um fundo suave para a página inteira -->
<div class="form-background">

  <!-- O cartão principal que contém o formulário -->
  <div class="form-card shadow-lg">

    <!-- Cabeçalho do Cartão -->
    <div class="card-header">
      <h2 class="mb-0">
        <i class="bi bi-box-seam me-2"></i> <!-- Ícone do Bootstrap -->
        Cadastro de Módulo
      </h2>
      <p class="text-muted mb-0">Preencha os dados para criar um novo módulo no sistema.</p>
    </div>

    <!-- Corpo do Cartão com o Formulário -->
    <div class="card-body">
      <!-- A tag <form> com o binding [formGroup] e o evento (ngSubmit) -->
      <form [formGroup]="moduloForm" (ngSubmit)="onSubmit()">

        <!-- Linha com 2 colunas: Código e Nome -->
        <div class="row mb-3">
          <div class="col-md-6">
            <label for="codigo" class="form-label">Código do Módulo</label>
            <input type="text" id="codigo" class="form-control" formControlName="codigo" placeholder="Ex: Cad_Modulos">
            <!-- Mensagem de erro para o campo 'codigo' -->
            <div *ngIf="isInvalid('codigo')" class="invalid-feedback d-block">
              O código é obrigatório.
            </div>
          </div>
          <div class="col-md-6">
            <label for="nome" class="form-label">Nome do Módulo</label>
            <input type="text" id="nome" class="form-control" formControlName="nome" placeholder="Ex: Cadastros">
            <div *ngIf="isInvalid('nome')" class="invalid-feedback d-block">
              O nome é obrigatório.
            </div>
          </div>
        </div>

        <!-- Campo Descrição -->
        <div class="mb-3">
          <label for="descricao" class="form-label">Descrição</label>
          <textarea id="descricao" class="form-control" formControlName="descricao" rows="3"
            placeholder="Descreva o objetivo deste módulo..."></textarea>
        </div>

        <!-- Linha com 2 colunas: Ícone e Ordem -->
        <div class="row mb-4">
          <!-- <div class="col-md-6">
            <label for="icone" class="form-label">Ícone</label>
            <input type="text" id="icone" class="form-control" formControlName="icone" placeholder="Ex: bi-box-seam">
          </div> -->
          <div class="col-md-6">
            <label for="ordem" class="form-label">Ordem de Exibição</label>
            <input type="number" id="ordem" class="form-control" formControlName="ordem" placeholder="Ex: 1" min="0">
            <div *ngIf="isInvalid('ordem')" class="invalid-feedback d-block">
              A ordem deve ser um número.
            </div>
          </div>
        </div>

        <!-- Checkbox 'Ativo' -->
        <div class="form-check form-switch mb-4">
          <input class="form-check-input" type="checkbox" role="switch" id="ativo" formControlName="ativo">
          <label class="form-check-label" for="ativo">Módulo Ativo</label>
        </div>

        <!-- Divisor -->
        <hr class="my-4">

        <!-- Botões de Ação -->
        <div class="d-flex justify-content-end gap-2">
          <button type="button" class="btn btn-secondary">Cancelar</button>
          <button type="submit" class="btn btn-submit" [disabled]="moduloForm.invalid">
            <i class="bi bi-check-lg me-1"></i>
            Salvar Módulo
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
